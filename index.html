<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030305" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SpectraLab Mobile — Espectrograma Vertical</title>
  <style>
    :root {
      --bg-void: #030305;
      --bg-surface: #0D1017;
      --bg-elevated: #161B26;
      --border-subtle: rgba(255, 255, 255, 0.14);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --accent-cyan: #00E5FF;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-amber: #F59E0B;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    /* Barra superior compacta */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 20;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
    }

    .status-badge.live .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.4s infinite;
    }

    .status-badge.demo .status-dot {
      background: var(--accent-amber);
      box-shadow: 0 0 8px var(--accent-amber);
    }

    .status-badge.error .status-dot {
      background: var(--accent-red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .telemetry-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .metric-label {
      font-size: 9px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Medidor VU */
    .vu-container {
      width: 100%;
      height: 4px;
      background: #090B10;
      flex-shrink: 0;
    }

    #vu-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981 0%, #00E5FF 65%, #F59E0B 85%, #EF4444 100%);
      transition: width 0.05s linear;
    }

    /* Lienzo principal maximizado */
    .canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--bg-void);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #axis-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Retículo táctil */
    #crosshair {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    #crosshair-h {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.45);
    }

    #crosshair-v {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0, 229, 255, 0.85);
    }

    #crosshair-tag {
      position: absolute;
      background: rgba(9, 11, 16, 0.94);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
    }

    /* Pantalla inicial */
    #overlay-prompt {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(3, 3, 5, 0.9);
      backdrop-filter: blur(8px);
      padding: 24px;
      text-align: center;
      z-index: 15;
      gap: 14px;
    }

    #overlay-prompt h1 {
      font-size: 21px;
      font-weight: 700;
    }

    #overlay-prompt p {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 310px;
      line-height: 1.5;
    }

    #error-box {
      display: none;
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #FCA5A5;
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 330px;
      line-height: 1.4;
    }

    .cta-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 260px;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-primary {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(239, 68, 68, 0.35);
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Cajón de ajustes */
    #settings-drawer {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-subtle);
      z-index: 20;
      flex-shrink: 0;
    }

    #settings-drawer.open {
      display: flex;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .setting-row label {
      color: var(--text-secondary);
      font-weight: 600;
      min-width: 105px;
    }

    .setting-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent-cyan);
      height: 26px;
    }

    .setting-row select {
      background: #0D1017;
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .diag-text {
      font-size: 10px;
      font-family: monospace;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 8px;
      border-radius: 6px;
      word-break: break-all;
    }

    /* Barra inferior táctil */
    .bottom-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 8px 10px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      z-index: 20;
      flex-shrink: 0;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .tool-btn.active {
      background: rgba(0, 229, 255, 0.16);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .tool-btn.mic-active {
      background: rgba(239, 68, 68, 0.22);
      border-color: var(--accent-red);
      color: #FCA5A5;
    }

    .tool-icon {
      font-size: 16px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div id="status-badge" class="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">LISTO</span>
      </div>

      <div class="telemetry-group">
        <div class="metric">
          <span class="metric-label">Pico</span>
          <span id="peak-freq" class="metric-value">-- Hz</span>
        </div>
        <div class="metric">
          <span class="metric-label">Nota</span>
          <span id="peak-note" class="metric-value">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">Nivel</span>
          <span id="peak-db" class="metric-value">-- dB</span>
        </div>
      </div>
    </header>

    <div class="vu-container">
      <div id="vu-bar"></div>
    </div>

    <main class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="spec-canvas"></canvas>
      <canvas id="axis-canvas"></canvas>

      <div id="crosshair">
        <div id="crosshair-h"></div>
        <div id="crosshair-v"></div>
        <div id="crosshair-tag">0 Hz</div>
      </div>

      <div id="overlay-prompt">
        <h1>SpectraLab Mobile</h1>
        <p>Cascada vertical de alta visibilidad optimizada para smartphone. Toca cualquier punto de la gráfica para medir su frecuencia y nota.</p>
        <div id="error-box"></div>
        <div class="cta-row">
          <button id="start-mic-btn" class="btn-primary">🎙️ Activar Micrófono</button>
          <button id="start-demo-btn" class="btn-secondary">🎛️ Probar en Modo Demo</button>
        </div>
      </div>
    </main>

    <section id="settings-drawer">
      <div class="setting-row">
        <label for="gain-slider">Sensibilidad (<span id="gain-val">+18</span> dB)</label>
        <input id="gain-slider" type="range" min="-5" max="45" step="1" value="18" />
      </div>
      <div class="setting-row">
        <label for="maxfreq-select">Rango Máximo</label>
        <select id="maxfreq-select">
